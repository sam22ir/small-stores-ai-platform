name: Deploy

on:
  push:
    branches:
      - claude/relaxed-euler-pi9ekq
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time per ref. Never cancel a running deploy: a half-applied migration is worse than a queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Secrets cannot be read in a job-level `if:`, so decide once here which deploys are configured.
  # Only booleans leave this job; secret values are never printed.
  check-secrets:
    name: Check deploy configuration
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.check.outputs.supabase }}
      dashboard: ${{ steps.check.outputs.dashboard }}
    steps:
      - id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing() { [ -z "${!1}" ]; }
          supabase=true
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if missing "$v"; then supabase=false; echo "Supabase deploy skipped: $v is not set."; fi
          done
          dashboard=true
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if missing "$v"; then dashboard=false; echo "Dashboard deploy skipped: $v is not set."; fi
          done
          echo "supabase=$supabase" >> "$GITHUB_OUTPUT"
          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"

  supabase:
    name: Supabase migrations and functions
    needs: check-secrets
    if: needs.check-secrets.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        run: supabase db push
      # verify_jwt for each function comes from supabase/config.toml, so it is not passed here.
      - name: Deploy Edge Functions
        run: |
          for fn in assistant-chat deliver-messages instagram-connect meta-webhook playground-chat telegram-webhook; do
            echo "Deploying $fn"
            supabase functions deploy "$fn"
          done

  dashboard:
    name: Dashboard build and Cloudflare Pages deploy
    needs: check-secrets
    if: needs.check-secrets.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
      VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.30.0 pages deploy dist --project-name store-assistant-dz --branch main
